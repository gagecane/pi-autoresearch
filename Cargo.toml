[package]
name = "pi_autoresearch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pi-autoresearch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"

[[bench]]
name = "benchmarks"
harness = false

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.5"
tempfile = "3.0"
rand = "0.8"
# Mutation testing support
# Install with: cargo install cargo-mutest
# Run with: cargo mutest test

# Coverage testing support
# Install with: cargo install cargo-llvm-cov
# Run with: cargo llvm-cov --lcov --output-path coverage_report/lcov.info
# Or use: ./scripts/run-coverage.sh
