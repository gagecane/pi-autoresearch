[package]
name = "pi_autoresearch-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.pi_autoresearch]
path = ".."

[[bin]]
name = "fuzz_baseline_record"
path = "fuzz_targets/fuzz_baseline_record.rs"
test = false
bench = false

[[bin]]
name = "fuzz_iteration_record"
path = "fuzz_targets/fuzz_iteration_record.rs"
test = false
bench = false

[[bin]]
name = "fuzz_experiment_session"
path = "fuzz_targets/fuzz_experiment_session.rs"
test = false
bench = false

[[bin]]
name = "fuzz_session_file"
path = "fuzz_targets/fuzz_session_file.rs"
test = false
bench = false

[features]
default = []
