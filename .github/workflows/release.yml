name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate Cargo.toml version
        run: |
          VERSION=${{ github.event.inputs.version || github.event.release.tag_name }}
          echo "Expected version: $VERSION"
          ACTUAL_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Actual version: $ACTUAL_VERSION"
          if [ "$VERSION" != "v$ACTUAL_VERSION" ] && [ "$VERSION" != "$ACTUAL_VERSION" ]; then
            echo "Error: Version mismatch! Expected $VERSION, found $ACTUAL_VERSION"
            exit 1
          fi

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: |
          cargo test --all
          cargo test --test integration_tests
          cargo test --test mutation_tests
          cargo test --test performance_tests

  build-and-release:
    name: Build and Release
    needs: validate-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin-name: pi-autoresearch-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin-name: pi-autoresearch-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin-name: pi-autoresearch-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin-name: pi-autoresearch-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target\${{ matrix.target }}\release
          cp pi-autoresearch.exe ${{ matrix.bin-name }}

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          cp pi-autoresearch ${{ matrix.bin-name }}
          strip ${{ matrix.bin-name }}

      - name: Create checksum
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum ${{ matrix.bin-name }} > ${{ matrix.bin-name }}.sha256

      - name: Upload binary to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.bin-name }}
            target/${{ matrix.target }}/release/${{ matrix.bin-name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-crates-io:
    name: Publish to crates.io
    needs: [validate-release, build-and-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  notify-success:
    name: Notify Success
    needs: [publish-to-crates-io, build-and-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [ "${{ needs.publish-to-crates-io.result }}" == "success" ] || [ "${{ needs.publish-to-crates-io.result }}" == "skipped" ]; then
            echo "Release completed successfully!"
            echo ""
            echo "Release artifacts are available at:"
            echo "https://github.com/${{ github.repository }}/releases"
            echo ""
            echo "Package published to crates.io:"
            echo "https://crates.io/crates/pi_autoresearch"
          else
            echo "Release failed. Please check the logs."
            exit 1
          fi
