name: Fuzz Testing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '60'
        type: number

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '60' }}

jobs:
  fuzz:
    name: Fuzz on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Can add more OSes: macos-latest, windows-latest
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          override: true
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
        env:
          CARGO_HOME: /usr/local/cargo

      - name: Build fuzz targets
        working-directory: fuzz
        run: |
          cargo fuzz build --sanitizer=fuzzer
          echo "Built fuzz targets:"
          ls -la fuzz_targets/

      - name: Run fuzz tests - BaselineRecord
        working-directory: fuzz
        run: |
          echo "Running fuzz_baseline_record for ${{ env.FUZZ_DURATION }} seconds..."
          timeout ${{ env.FUZZ_DURATION }}s cargo fuzz run fuzz_baseline_record -max_time=${{ env.FUZZ_DURATION }} || [ $? -eq 124 ]
          echo "Fuzz run completed (timeout is expected)"

      - name: Run fuzz tests - IterationRecord
        working-directory: fuzz
        run: |
          echo "Running fuzz_iteration_record for ${{ env.FUZZ_DURATION }} seconds..."
          timeout ${{ env.FUZZ_DURATION }}s cargo fuzz run fuzz_iteration_record -max_time=${{ env.FUZZ_DURATION }} || [ $? -eq 124 ]
          echo "Fuzz run completed (timeout is expected)"

      - name: Run fuzz tests - ExperimentSession
        working-directory: fuzz
        run: |
          echo "Running fuzz_experiment_session for ${{ env.FUZZ_DURATION }} seconds..."
          timeout ${{ env.FUZZ_DURATION }}s cargo fuzz run fuzz_experiment_session -max_time=${{ env.FUZZ_DURATION }} || [ $? -eq 124 ]
          echo "Fuzz run completed (timeout is expected)"

      - name: Run fuzz tests - Session File
        working-directory: fuzz
        run: |
          echo "Running fuzz_session_file for ${{ env.FUZZ_DURATION }} seconds..."
          timeout ${{ env.FUZZ_DURATION }}s cargo fuzz run fuzz_session_file -max_time=${{ env.FUZZ_DURATION }} || [ $? -eq 124 ]
          echo "Fuzz run completed (timeout is expected)"

      - name: Check for crashes
        working-directory: fuzz
        run: |
          echo "Checking for crashes..."
          if [ -d "artifacts" ] && [ "$(find artifacts -type f -name 'crash-*' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "ERROR: Crashes found!"
            find artifacts -type f -name 'crash-*' -exec echo "Crash: {}" \;
            find artifacts -type f -name 'crash-*' -exec cat {} \;
            exit 1
          fi
          echo "No crashes found - all fuzz tests passed!"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ runner.os }}
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ runner.os }}
          path: fuzz/corpus/
          retention-days: 7
          if-no-files-found: ignore

  fuzz-report:
    name: Generate Fuzz Report
    runs-on: ubuntu-latest
    needs: fuzz
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check fuzz results
        run: |
          if [ "${{ needs.fuzz.result }}" == "success" ]; then
            echo "✅ All fuzz tests passed!"
            echo "No crashes detected in any fuzz targets."
          else
            echo "❌ Fuzz tests failed or found crashes!"
            echo "Check the uploaded artifacts for crash details."
          fi

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: fuzz
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "🚨 Fuzz testing failed!"
          echo "Please check the workflow logs and uploaded artifacts."
          echo "Crash artifacts are available for analysis."
          exit 1
